name: Build LandmarkID APK

on:
  push:
    branches: [ main, master, 'claude/**' ]
    paths:
      - 'landmarkid/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/build-landmarkid-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" >> local.properties
          echo "maps.api.key=${{ secrets.MAPS_API_KEY }}" >> local.properties

      - name: Build debug APK
        run: ./gradlew :landmarkid:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: landmarkid-debug
          path: landmarkid/build/outputs/apk/debug/*.apk
          retention-days: 14
